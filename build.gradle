// Root project holds shared settings — every Minecraft version has its own module, and all of
// them compile the same sources from common/ plus their own compat classes.

// The mod icon is stored as text (tools/icon.png.base64) because binary blobs are awkward in
// review diffs; this single task materialises it for every module.
tasks.register('generateIcon') {
    def source = file('tools/icon.png.base64')
    def target = file('common/src/main/resources/assets/potionhudx/icon.png')
    inputs.file source
    outputs.file target
    doLast {
        target.parentFile.mkdirs()
        target.bytes = source.text.replaceAll('\\s', '').decodeBase64()
    }
}
