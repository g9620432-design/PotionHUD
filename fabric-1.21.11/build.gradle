plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name + "-fabric-" + project.minecraft_version
}

sourceSets {
    main {
        java { srcDirs = [rootProject.file('common/src/main/java'), file('src/main/java')] }
        resources { srcDirs = [rootProject.file('common/src/main/resources'), file('src/main/resources')] }
    }
}

repositories {
    mavenCentral()
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mc_range', project.mc_range
    inputs.property 'loader_range', project.loader_range
    filteringCharset 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand 'version': project.version,
               'mc_range': project.mc_range,
               'loader_range': project.loader_range
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_potionhudx" }
    }
}

loom {
    runs {
        client {
            programArgs '--width', '1280', '--height', '720'
        }
    }
}

processResources.dependsOn rootProject.tasks.named('generateIcon')
tasks.named('sourcesJar') { dependsOn rootProject.tasks.named('generateIcon') }
